apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "networkclaw-bundle.fullname" . }}-lobby
  labels:
    {{- include "networkclaw-bundle.labels" . | nindent 4 }}
    app.kubernetes.io/component: lobby
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "networkclaw-bundle.fullname" . }}-lobby-discovery
  labels:
    {{- include "networkclaw-bundle.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "networkclaw-bundle.fullname" . }}-lobby-discovery
  labels:
    {{- include "networkclaw-bundle.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "networkclaw-bundle.fullname" . }}-lobby-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "networkclaw-bundle.fullname" . }}-lobby
