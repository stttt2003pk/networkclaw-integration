name: ubuntu-22.04-linux-amd64

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.NETWORKCLAW_REPOSITORY || 'stttt2003pk/NetworkClawV1' }}
          path: NetworkClaw
          ref: ${{ vars.NETWORKCLAW_REF || '90bd6c0d07eca6426c9ca62f8043dffa3f9d95d4' }}
          token: ${{ secrets.SOURCE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.HARNESS_REPOSITORY || 'stttt2003pk/networkclaw-harness' }}
          path: networkclaw-harness
          ref: ${{ vars.HARNESS_REF || '5b3284a2a75db3d036e83fabf1d76955d419c395' }}
          token: ${{ secrets.SOURCE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: NetworkClaw/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: NetworkClaw/web2/package-lock.json
      - uses: docker/setup-buildx-action@v3
      - name: Prepare Linux amd64 offline wheelhouse
        env:
          WHEELHOUSE: ${{ github.workspace }}/.integration-state/ci/wheelhouse
        run: |
          mkdir -p "$WHEELHOUSE"
          python -m pip download --dest "$WHEELHOUSE" --only-binary=:all: \
            --platform manylinux_2_17_x86_64 --implementation cp --python-version 3.12 --abi cp312 \
            -r networkclaw-harness/requirements.lock \
            -r networkclaw-harness/requirements-dev.lock \
            -r networkclaw-harness/requirements-build.lock
          python -m pip download --dest "$WHEELHOUSE" --only-binary=:all: \
            --platform manylinux_2_17_x86_64 --implementation cp --python-version 3.12 --abi cp312 \
            'jsonschema==4.25.1' 'PyYAML==6.0.3'
          python -m pip download --dest "$WHEELHOUSE" --only-binary=:all: --no-deps \
            --platform manylinux_2_17_x86_64 --implementation cp --python-version 3.12 --abi cp312 \
            'python-dotenv==1.2.2' 'setuptools==84.0.0' 'wheel==0.48.0'
      - name: Run Ubuntu 22.04 gates
        env:
          NETWORKCLAW_PATH: ${{ github.workspace }}/NetworkClaw
          HARNESS_PATH: ${{ github.workspace }}/networkclaw-harness
          CI_WHEELHOUSE: ${{ github.workspace }}/.integration-state/ci/wheelhouse
          CI_OFFLINE: '1'
          CI_REQUIRE_CLEAN: '1'
        run: ./ci/ubuntu-22.04/ci-test.sh
      - name: Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          set +e
          "$(go env GOPATH)/bin/govulncheck" ./... > "$GITHUB_WORKSPACE/.integration-state/evidence/govulncheck.txt" 2>&1
          code=$?
          cat "$GITHUB_WORKSPACE/.integration-state/evidence/govulncheck.txt"
          exit "$code"
        working-directory: NetworkClaw
      - name: Build Linux amd64 artifact and image
        env:
          NETWORKCLAW_PATH: ${{ github.workspace }}/NetworkClaw
          HARNESS_PATH: ${{ github.workspace }}/networkclaw-harness
          CI_WHEELHOUSE: ${{ github.workspace }}/.integration-state/ci/wheelhouse
        run: python3.12 ci/ubuntu-22.04/build-artifacts.py
      - name: Install SBOM and security scanners
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "$RUNNER_TEMP/bin" v1.52.0
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$RUNNER_TEMP/bin" v0.74.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/syft" version
          "$RUNNER_TEMP/bin/trivy" version
      - name: Warm Trivy vulnerability database
        run: trivy image --download-db-only --no-progress --db-repository ghcr.io/aquasecurity/trivy-db:2 alpine:3.20
      - name: Generate SBOM and scan image
        env:
          TRIVY_SKIP_DB_UPDATE: '1'
          TRIVY_SKIP_CHECK_UPDATE: '1'
        run: make security-scan IMAGE_ARCHIVE=.integration-state/artifacts/ubuntu-22.04-linux-amd64/networkclaw-linux-amd64.docker.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: networkclaw-ubuntu-22.04-linux-amd64-evidence
          path: |
            .integration-state/evidence/ubuntu-22.04-*.json
            .integration-state/evidence/ubuntu-22.04-*.log
            .integration-state/evidence/image-sbom.cdx.json
            .integration-state/evidence/trivy.json
            .integration-state/evidence/image-license-summary.json
            .integration-state/evidence/govulncheck.txt
            .integration-state/evidence/bundle-self-test.json
            .integration-state/evidence/combination-matrix.json
            .integration-state/evidence/combination-matrix.md
            .integration-state/artifacts/networkclaw-bundle.tar.gz
            .integration-state/artifacts/networkclaw-bundle.tar.gz.sha256
            .integration-state/artifacts/ubuntu-22.04-linux-amd64/*.oci.tar
            .integration-state/artifacts/ubuntu-22.04-linux-amd64/*.docker.tar
            .integration-state/artifacts/ubuntu-22.04-linux-amd64/build-manifest.json
          if-no-files-found: warn
